<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>음악 취향 테스트</title>
  <style>
    :root {
      --main-purple: #6C5CE7;
      --sub-purple: #F0EDFF;
      --sub-yellow: #FFC72C;
      --soft-mint: #E6F8F3;
      --card-border: #1A1A1A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    
    body { 
      background-color: #E2E0F8; 
      color: #1A1A1A; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    /* 화면 비율: 1080px * 1920px (종횡비 9:16) 맞춤 조정 */
    .container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 800px;
      aspect-ratio: 9 / 16;
      background-color: #ffffff;
      padding: 24px 20px;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    /* 페이지 화면 제어 */
    .page { display: none; flex-direction: column; flex-grow: 1; height: 100%; justify-content: space-between; }
    .page.active { display: flex; animation: fadeIn 0.3s ease; }

    /* ================= 1. 표지 페이지 ================= */
    .cover-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      width: 100%;
      padding-bottom: 16px;
    }

    .cover-start-img-btn {
      width: 100%;
      max-width: 380px;
      cursor: pointer;
      transition: transform 0.1s ease;
      display: block;
      margin: 0 auto;
    }
    .cover-start-img-btn:active {
      transform: scale(0.96);
    }

    /* ================= 2. 질문 페이지 ================= */
    .question-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      padding: 10px 0;
      width: 100%;
    }

    .progress-bar {
      width: 90%; /* 박스 크기들과 통일감 부여 */
      height: 8px;
      background: rgba(233, 239, 247, 0.9);
      border-radius: 4px;
      margin-bottom: 16px;
      border: 1.5px solid var(--card-border);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--main-purple);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 질문 박스: 가로 폭 90%로 축소 및 중앙 정렬 */
    .question-title {
      width: 90%;
      font-size: 16px;
      font-weight: 800;
      color: #1A1A1A;
      background-color: var(--soft-mint);
      margin-bottom: 16px;
      line-height: 1.4;
      word-break: keep-all;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid var(--card-border);
      box-shadow: 2px 2px 0px var(--card-border);
      text-align: center;
    }

    /* 선택지 박스 컨테이너 */
    .options-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    /* 선택지 박스: 가로 폭 90%로 질문 박스와 완전히 동일하게 적용 */
    .option-btn {
      width: 90%;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 13.5px;
      line-height: 1.35;
      color: #333;
      font-weight: 600;
      word-break: keep-all;
      box-shadow: 2px 2px 0px var(--card-border);
    }
    .option-btn:hover, .option-btn:active {
      background: var(--sub-purple);
      color: var(--main-purple);
    }

    /* ================= 3. 결과 페이지 ================= */
    .result-content {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: center;
      gap: 12px;
      height: 100%;
      padding: 10px 0;
      overflow-y: auto;
    }

    /* 결과 문구 박스 */
    .result-header {
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 14px 12px;
      border-radius: 14px;
      border: 2px solid var(--card-border);
      box-shadow: 3px 3px 0px var(--card-border);
      margin-bottom: 4px;
      width: 90%;
      margin-left: auto;
      margin-right: auto;
    }
    .result-tag {
      display: inline-block;
      background: var(--sub-yellow);
      color: #333;
      font-size: 11.5px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 14px;
      margin-bottom: 6px;
      border: 1.5px solid var(--card-border);
    }
    .result-type-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--main-purple);
      margin-bottom: 4px;
    }
    .result-desc {
      font-size: 12.5px;
      color: #444;
      line-height: 1.4;
      word-break: keep-all;
    }

    /* 노래 추천 리스트 */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .song-item {
      width: 90%;
      margin: 0 auto;
      background: rgba(255, 253, 245, 0.95);
      border: 2px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      box-shadow: 2px 2px 0px var(--card-border);
    }
    .song-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .song-title { font-size: 13px; font-weight: 700; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 11.5px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .listen-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FF0000;
      color: white;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 8px;
      border-radius: 14px;
      white-space: nowrap;
      border: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    /* 하단 버튼 그룹 */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
      width: 100%;
      align-items: center;
    }

    .primary-btn {
      background: var(--main-purple);
      color: white;
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 11px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 90%;
      text-align: center;
      box-shadow: 2px 2px 0px var(--card-border);
    }

    .share-btn {
      background: #ffffff;
      border: 2px solid var(--card-border);
      color: var(--card-border);
      font-size: 13.5px;
      font-weight: bold;
      padding: 10px;
      border-radius: 24px;
      cursor: pointer;
      width: 90%;
      box-shadow: 2px 2px 0px var(--card-border);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

      container.style.backgroundImage = `url('${bgCover}')`;
    } else {
      container.style.backgroundImage = `url('${bgSub}')`;
    }
  }

  function startTest() {
    currentStep = 0;
    totalScore = 0;
    showPage('question-page');
    renderQuestion();
  }

  function renderQuestion() {
    const qData = questions[currentStep];
    document.getElementById('questionTitle').innerText = qData.q;
    
    const progressPercent = ((currentStep + 1) / questions.length) * 100;
    document.getElementById('progressFill').style.width = `${progressPercent}%`;

    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';

    qData.a.forEach(opt => {
      const btn = document.createElement('div');
      btn.className = 'option-btn';
      btn.innerText = opt.text;
      btn.onclick = () => selectAnswer(opt.score);
      container.appendChild(btn);
    });
  }

  function selectAnswer(score) {
    totalScore += score;
    currentStep++;

    if (currentStep < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    let resultKey = "추억아련";

    if (totalScore <= 8) {
      resultKey = "희생애절";
    } else if (totalScore <= 11) {
      resultKey = "담담성찰";
    } else if (totalScore <= 15) {
      resultKey = "위로극복";
    } else if (totalScore <= 18) {
      resultKey = "감성낭만";
    } else if (totalScore <= 21) {
      resultKey = "우정하모니";
    } else {
      resultKey = "추억아련";
    }

    const data = results[resultKey];

    document.getElementById('resultTypeTitle').innerText = data.title;
    document.getElementById('resultDesc').innerText = data.desc;

    const songListContainer = document.getElementById('songList');
    songListContainer.innerHTML = '';

    data.songs.forEach(song => {
      const item = document.createElement('div');
      item.className = 'song-item';
      item.innerHTML = `
        <div class="song-info">
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist}</div>
        </div>
        <a href="${song.link}" target="_blank" class="listen-btn">
          ▶ 바로듣기
        </a>
      `;
      songListContainer.appendChild(item);
    });

    showPage('result-page');
  }

  function restartTest() {
    startTest();
  }

  function copyURL() {
    const currentURL = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentURL).then(() => {
        alert('링크가 클립보드에 복사되었습니다!');
      }).catch(() => fallbackCopy(currentURL));
    } else {
      fallbackCopy(currentURL);
    }
  }

  function fallbackCopy(text) {
    const tempInput = document.createElement('input');
    tempInput.value = text;
    document.body.appendChild(tempInput);
    tempInput.select();
    try {
      document.execCommand('copy');
      alert('링크가 클립보드에 복사되었습니다!');
    } catch (err) {
      alert('주소 복사에 실패했습니다.');
    }
    document.body.removeChild(tempInput);
  }
</script>

</body>
</html>
